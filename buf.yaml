version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # These protos mirror OpenShell's public wire contract and cannot be renamed
  # or moved without breaking compatibility with the gateway.
  except:
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
